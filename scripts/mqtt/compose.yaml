services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /opt/mqtt/mosquitto/config:/mosquitto/config
      - /opt/mqtt/mosquitto/data:/mosquitto/data
      - /opt/mqtt/mosquitto/log:/mosquitto/log